# to be used with https://github.com/caksoylar/keymap-drawer
layout:
  qmk_keyboard: crkbd/rev1
  qmk_layout: LAYOUT_split_3x6_3
layers:
  BASE:
    - [{t: "`", s: "~"}, "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", {t: "=", s: "+"}]
    - [null, {t: "A", h: "Ctrl"}, {t: "S", h: "Alt"}, {t: "D", h: "Super"}, {t: "F", h: "Shift"}, "G", "H", {t: "J", h: "Shift"}, {t: "K", h: "Super"}, {t: "L", h: "Alt"}, {t: ";", s: ":", h: "Ctrl"}, {t: "'", s: '"'}]
    - [null, "Z", "X", "C", "V", "B", "N", "M", {t: ",", s: "<"}, {t: ".", s: ">"}, {t: "/", s: "?"}, {t: "-", s: "_"}]
    - [{t: $$mdi:keyboard-esc$$, h: Fun}, {t: $$mdi:backspace-outline$$, h: Nav}, {t: $$mdi:keyboard-tab$$, h: Num}, {t: $$mdi:keyboard-return$$, h: Mouse}, {t: $$mdi:keyboard-space$$, h: Game}, {t: $$mdi:backspace-reverse-outline$$, h: Media}]
  NAV:
    - [null, null, null, null, null, null, "(", "{", "}", "[", "]", ")"]
    - [null, "Ctrl", "Alt", "Super", "Shift", null, $$mdi:arrow-left$$, $$mdi:arrow-down$$, $$mdi:arrow-up$$, $$mdi:arrow-right$$, "Caps Word", null]
    - [null, null, null, null, null, null, null, "(", ")", "|", "\\", "|"]
    - [null, {type: held}, null, "$$mdi:keyboard-return$$", "$$mdi:backspace-outline$$", "$$mdi:backspace-reverse-outline$$"]
  NUM:
    - [null, null, null, null, null, null, {t: "[", s: "{"}, {t: "7", s: "&"}, {t: "8", s: "*"}, {t: "9", s: "("}, {t: "]", s: "}"}, null]
    - [null, "Ctrl", "Alt", "Super", "Shift", null, {t: ";", s: ":"}, {t: "4", s: "$"}, {t: "5", s: "%"}, {t: "6", s: "^"}, {t: "=", s: "+"}, null]
    - [null, null, null, null, null, null, {t: "`", s: "~"}, {t: "1", s: "!"}, {t: "2", s: "@"}, {t: "3", s: "#"}, {t: "\\", s: "|"}, null]
    - [null, null, {type: held}, {t: ".", s: ">"}, {t: "0", s: ")"}, {t: "-", s: "_"}]
  FUN:
    - [null, null, null, null, null, null, "PrtScn SysRq", "F7", "F8", "F9", "F12", null]
    - [null, "Ctrl", "Alt", "Super", "Shift", null, "Scroll Lock", "F4", "F5", "F6", "F11", "Game Layer"]
    - [null, null, null, null, null, null, "Pause Break", "F1", "F2", "F3", "F10", null]
    - [{type: held}, null, null, null, null, null]
  MOUSE:
    - [null, null, null, null, null, null, null, null, null, null, null, null]
    - [null, null, $$mdi:arrow-left-bold$$, $$mdi:arrow-up-bold$$, $$mdi:arrow-down-bold$$, $$mdi:arrow-right-bold$$, null, "Shift", "Super", "Alt", "Ctrl", null]
    - [null, null, $$mdi:arrow-left-bold-outline$$, $$mdi:arrow-down-bold-outline$$, $$mdi:arrow-up-bold-outline$$, $$mdi:arrow-right-bold-outline$$, null, null, null, null, null, null]
    - ["Middle click", "Left click", "Right click", {type: held}, null, null]
  MEDIA:
    - ["RGB Speed", "RGB Mod", "RGB Hue", "RGB Sat", "RGB Val", "RGB Tog", null, null, null, null, null, null]
    - [null, null, $$mdi:skip-previous$$, $$mdi:volume-plus$$, $$mdi:volume-minus$$, $$mdi:skip-next$$, null, "Shift", "Super", "Alt", "Ctrl", null]
    - [null, null, null, null, null, null, null, null, null, null, null, null]
    - [$$mdi:stop$$, $$mdi:play-pause$$, $$mdi:volume-mute$$, null, null, {type: held}]
  GAME:
    - [Ctrl, "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", {t: "=", s: "+"}]
    - [Shift, "A", "S", "D", "F", "G", "H", "J", "K", "L", {t: ";", s: ":"}, {t: "'", s: '"'}]
    - [Alt, "Z", "X", "C", "V", "B", "N", "M", {t: ",", s: "<"}, {t: ".", s: ">"}, {t: "/", s: "?"}, {t: "-", s: "_"}]
    - [{t: $$mdi:keyboard-esc$$}, {t: $$mdi:backspace-outline$$}, {t: $$mdi:keyboard-tab$$}, {t: $$mdi:keyboard-return$$}, {type: held, t: $$mdi:keyboard-space$$}, {t: "Base Layer"}]
